name: R fixtures

# Regenerates the reference fixtures with R mice 3.19.0 and runs the parity
# tests against them. Manual only: it installs R packages from source and
# runs the layer-2 generators, which takes a while.
on:
  workflow_dispatch:

env:
  UV_VERSION: "0.8.20"
  MPLBACKEND: Agg

jobs:
  regenerate:
    name: Regenerate fixtures and run the parity tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install mice 3.19.0, ranger, rpart, jsonlite
        shell: Rscript {0}
        run: |
          # current mice brings its dependencies as binaries; then mice itself
          # is replaced by 3.19.0, built from the CRAN source archive
          install.packages(c("remotes", "ranger", "rpart", "jsonlite", "mice"))
          remotes::install_version(
            "mice", version = "3.19.0", upgrade = "never",
            repos = "https://cloud.r-project.org"
          )
          stopifnot(as.character(packageVersion("mice")) == "3.19.0")
          print(sessionInfo())

      - name: Regenerate the fixtures
        run: Rscript tests/reference/r/generate_all.R

      - name: Changes against the committed fixtures (for information)
        # R on another platform can differ in the last digit, so byte
        # differences do not fail the job; the parity tests below decide.
        run: git diff --stat tests/reference/fixtures || true

      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-fixtures
          path: tests/reference/fixtures

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Parity tests against the regenerated fixtures
        run: uv run --no-sync pytest -q -p no:cacheprovider tests/test_parity
