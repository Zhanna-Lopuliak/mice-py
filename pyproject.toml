[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mice-py"
version = "0.2.0"
description = "A comprehensive Python implementation of Multiple Imputation by Chained Equations (MICE) for handling missing data"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Anna-Carolina Haensch", email = "Anna-Carolina.Haensch@stat.uni-muenchen.de"},
    { name = "The Anh Vu", email = "Theanh_v99@yahoo.de"},
    { name = "Zhanna Lopuliak", email = "zhanna.Lopuliak@gmail.com"}
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "seaborn>=0.12",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "hypothesis>=6.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.2",
]
notebooks = [
    "jupyter>=1.0",
    "nbmake>=1.5",
]

[dependency-groups]
# Installed by `uv sync` by default: the test extra plus the lint and type tools
dev = [
    "mice-py[test]",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.5",
]

[tool.setuptools]
packages = ["imputation", "plotting"]
include-package-data = false

[tool.setuptools.package-data]
imputation = ["py.typed"]
plotting = ["py.typed"]


[tool.ruff]
line-length = 120
target-version = "py39"
# docs/ and the Markdown files are rewritten in the docs phase; notebooks are not linted
extend-exclude = ["docs", "*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "PD"]
ignore = [
    # `.values` keeps pandas extension arrays (Categorical) that
    # `.to_numpy()` would turn into object arrays
    "PD011",
    # `.at` is pandas' scalar accessor; `.loc` is no improvement there
    "PD008",
    # proposes another constancy test, which treats missing values differently
    "PD101",
]

[tool.ruff.lint.isort]
known-first-party = ["imputation", "plotting"]


[tool.mypy]
python_version = "3.9"
files = ["imputation", "plotting"]
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
# No type information ships with these; pandas-stubs and scipy-stubs exist
# but check far more strictly than this configuration intends
module = ["pandas.*", "scipy.*", "sklearn.*", "statsmodels.*", "seaborn.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--color=yes",
]

markers = [
    "unit: Unit tests for individual functions/classes",
    "integration: Integration tests for workflows",
    "plotting: Tests for plotting functionality",
    "slow: Tests that take longer to run",
    "parity: Comparisons against reference output from R mice",
]

timeout = 300

filterwarnings = [
    # Warnings are not suppressed globally. Tests that expect one of the
    # package's warnings check it with pytest.warns; third-party warnings
    # that the tests cannot avoid are listed here, each with its reason.
    #
    # seaborn 0.13 passes `vert` to matplotlib's boxplot, which matplotlib
    # 3.10 is phasing out (bwplot)
    "ignore:vert. bool will be deprecated in a future version:PendingDeprecationWarning:seaborn",
]

[tool.coverage.run]
source = ["imputation", "plotting"]
branch = true
